name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to a new release in October 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        # The annotate plugin turns test failures into public annotations on the run (readable without a login).
        run: pip install -e ".[dev]" pytest-github-actions-annotate-failures

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Runner notebook is up to date
        run: python tools/make_runner_nb.py --check

      - name: Tests
        run: pytest -q -m "not slow"
