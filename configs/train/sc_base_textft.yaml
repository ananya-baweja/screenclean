# Job 0011: text fine-tune. Start from the best weights of the main run (0009) and keep training on a
# mix of real UHDM photos (70%) and simulated text pairs (30%, P4), with a lower learning rate, so the
# model gets better at text without forgetting photos. About 90 minutes on a T4.
# Validation on both kinds of data; best.pt is picked by their average PSNR.
run: runs/0011_finetune_text
data:
  train: [data/uhdm_v1/train, data/synth_v1/train]
  val: {uhdm: data/uhdm_v1/val, text: data/synth_v1/val}
  local_dir: /content/train_data
train:
  model: scnet_base
  init_from: runs/0009_train_sc_base/best.pt
  source_weights: [0.7, 0.3]
  crop: 384
  batch: 6
  workers: 2
  iters: auto
  budget_minutes: 75
  val_seconds: 120           # 400 UHDM + 300 text crops
  compile: auto
  optim: {lr: 1.0e-4, warmup: 500, min_lr: 1.0e-6}
  loss: {fft_weight: 1.0}
  val_every: 2000
  val_weights: {uhdm: 0.5, text: 0.5}
  log_every: 50
  ckpt_minutes: 15
stop_margin_min: 8
