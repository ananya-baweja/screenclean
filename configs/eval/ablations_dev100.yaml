# Job 0017: the text fine-tune (0011) and the five ablations (0012-0016) on UHDM dev100, whole 4K images,
# fp16, with LPIPS. The main model's row comes from job 0010. Ablations are scored on their final weights
# (last.pt, EMA): all trained for the same 8,000 iterations, none picked with validation data.
split: data/uhdm_v1/dev100
local_dir: /content/eval_data
sample_images: 4
lpips: true
stop_margin_min: 10
methods:
  - {name: identity, label: "Input (no cleaning)"}
  - {name: scnet, label: "ScreenCleanNet + text fine-tune", checkpoint: runs/0011_finetune_text/best.pt}
  - {name: scnet, label: "Ablation: full model, short schedule", checkpoint: runs/0012_abl_full/last.pt}
  - {name: scnet, label: "Ablation: no FFT loss", checkpoint: runs/0013_abl_no_fftloss/last.pt}
  - {name: scnet, label: "Ablation: plain U-Net (no wavelets, no dilation)", checkpoint: runs/0014_abl_plain_unet/last.pt}
  - {name: scnet, label: "Ablation: no dilation", checkpoint: runs/0015_abl_no_dilation/last.pt}
  - {name: scnet, label: "Ablation: simulator data only", checkpoint: runs/0016_abl_sim_only/last.pt}
