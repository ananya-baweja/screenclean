job:
  id: 0011_finetune_text
  task: train
  runtime: gpu
  config: configs/train/sc_base_textft.yaml
  depends_on:
  - 0009_train_sc_base
  - 0006_gen_synth
  max_minutes: 110
  resume: true
  attempt: 1
  drive_subdir: jobs/0011_finetune_text
  notes: 'Text fine-tune from 0009''s best weights: UHDM 70% + simulated text 30%,
    lr 1e-4 (T4, ~90 min)'
config:
  run: runs/0011_finetune_text
  data:
    train:
    - data/uhdm_v1/train
    - data/synth_v1/train
    val:
      uhdm: data/uhdm_v1/val
      text: data/synth_v1/val
    local_dir: /content/train_data
  train:
    model: scnet_base
    init_from: runs/0009_train_sc_base/best.pt
    source_weights:
    - 0.7
    - 0.3
    crop: 384
    batch: 6
    workers: 2
    iters: auto
    budget_minutes: 75
    val_seconds: 120
    compile: auto
    optim:
      lr: 0.0001
      warmup: 500
      min_lr: 1.0e-06
    loss:
      fft_weight: 1.0
    val_every: 2000
    val_weights:
      uhdm: 0.5
      text: 0.5
    log_every: 50
    ckpt_minutes: 15
  stop_margin_min: 8
