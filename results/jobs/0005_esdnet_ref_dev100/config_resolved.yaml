  - name: esdnet_ref
    label: ESDNet (reference)
    repo_sha: fa70a92d3d4f35d5c4e3fa7a54e3b2e5b995f1cd
    weights:
      id: 1HT_ubcAYRqzFIJ46XuPhrulJk2YFBIEl
      bytes: 23895301
