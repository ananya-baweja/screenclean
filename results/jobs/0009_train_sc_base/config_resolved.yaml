job:
  id: 0009_train_sc_base
  task: train
  runtime: gpu
  config: configs/train/sc_base_uhdm.yaml
  depends_on:
  - 0002_prepare_uhdm
  - 0008_sanity_gpu
  max_minutes: 150
  resume: true
  attempt: 2
  drive_subdir: jobs/0009_train_sc_base
  notes: Main training of scnet_base on UHDM (T4). Run again after each TIME BUDGET
    REACHED until JOB FINISHED (~2-3 runs).
config:
  run: runs/0009_train_sc_base
  data:
    train:
    - data/uhdm_v1/train
    val: data/uhdm_v1/val
    local_dir: /content/train_data
  train:
    model: scnet_base
    crop: 384
    batch: 6
    workers: 2
    iters: auto
    budget_minutes: 270
    val_seconds: 95
    compile: auto
    probe_iters: 40
    optim:
      lr: 0.0003
      warmup: 1000
      min_lr: 1.0e-06
    loss:
      fft_weight: 1.0
    val_every: 2000
    log_every: 50
    ckpt_minutes: 15
  stop_margin_min: 8
